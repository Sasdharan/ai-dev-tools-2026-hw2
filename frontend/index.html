<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>CloseTab MVP - Frontend</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app">
      <header>
        <h1>CloseTab MVP</h1>
        <div id="group-controls"></div>
      </header>

      <main>
        <section id="group-panel" class="panel" aria-labelledby="group-heading">
          <h2 id="group-heading"><span class="section-icon" aria-hidden="true">◈</span>Group</h2>
          <div id="group-info" aria-live="polite"></div>
          <div class="controls">
            <button id="close-group-btn" aria-label="Close group"><span aria-hidden="true">▣</span> Close Group</button>
            <button id="reopen-group-btn" aria-label="Reopen group"><span aria-hidden="true">↻</span> Reopen Group</button>
          </div>
        </section>

        <section id="members-panel" class="panel" aria-labelledby="members-heading">
          <h2 id="members-heading"><span class="section-icon" aria-hidden="true">♧</span>Members</h2>
          <div id="members-list" role="list"></div>
          <div class="member-controls">
            <label for="member-name" class="sr-only">New member name</label>
            <input id="member-name" placeholder="New member name" aria-label="New member name" />
            <button id="add-member-btn" aria-label="Add member"><span aria-hidden="true">+</span> Add Member</button>
          </div>
        </section>

        <section id="expense-panel" class="panel" aria-labelledby="expenses-heading">
          <h2 id="expenses-heading"><span class="section-icon" aria-hidden="true">▤</span>Expenses</h2>
          <form id="expense-form">
            <label for="expense-desc" class="sr-only">Description</label>
            <input id="expense-desc" placeholder="Description" required aria-label="Expense description" />
            <label for="expense-amt" class="sr-only">Amount</label>
            <input id="expense-amt" type="number" step="0.01" placeholder="Amount" required aria-label="Expense amount" />
            <label for="expense-date" class="sr-only">Date</label>
            <input id="expense-date" type="date" aria-label="Expense date" />
            <div id="expense-payer-control">
              <label for="expense-payer">Payer:</label>
              <select id="expense-payer" aria-label="Expense payer"></select>
            </div>
            <fieldset>
              <legend class="sr-only">Split mode</legend>
              <label><input type="radio" name="mode" value="everyone" checked /> Everyone</label>
              <label><input type="radio" name="mode" value="selected" /> Selected Members</label>
            </fieldset>
            <div id="participant-list" role="group" aria-label="Participants"></div>
            <button id="expense-submit" type="submit" aria-label="Add expense"><span aria-hidden="true">+</span> Add Expense</button>
          </form>
          <div id="expenses-list" aria-live="polite"></div>
        </section>

        <section id="settlement-panel" class="panel" aria-labelledby="settlements-heading">
          <h2 id="settlements-heading"><span class="section-icon" aria-hidden="true">⇄</span>Settlements</h2>
          <div id="balances" aria-live="polite"></div>
          <h3>Record Settlement</h3>
          <label class="sr-only" for="settle-from">From</label>
          <select id="settle-from" aria-label="Settlement from"></select>
          <label class="sr-only" for="settle-to">To</label>
          <select id="settle-to" aria-label="Settlement to"></select>
          <label class="sr-only" for="settle-amt">Amount</label>
          <input id="settle-amt" type="number" step="0.01" placeholder="Amount" aria-label="Settlement amount" />
          <button id="record-settlement-btn" aria-label="Record settlement"><span aria-hidden="true">✓</span> Record</button>
          <div id="settlements-list" aria-live="polite"></div>
        </section>
      </main>

      <footer>
        <small>Data resets when the server restarts.</small>
      </footer>
    </div>

    <script type="module" src="app.js"></script>
  </body>
</html>
